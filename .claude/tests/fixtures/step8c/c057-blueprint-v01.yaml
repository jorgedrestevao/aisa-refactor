# Fixture — the C-057 regression shape, version BEFORE the new fact (mirrors Pilot-1 blueprint v01).
blueprint_id: bp-v01
architecture:
  scope: whole solution
  authorization: authorized
  experience:
    mode: owned-internal
    primary_surface: "Record-centric app (model-driven)"
    su_refs: [C-013, C-002, C-056]
