pack_id: pp
pack_version: 1.2.0
display_name: "Power Platform Discovery"
language: pt
description: >
  Discovery and sensemaking pack tuned for Power Platform engagements.
  Vocabulary, question-bank, and deliverable templates aligned with
  Canvas Apps, Model-driven Apps, Power Automate, Dataverse.

deliverables:
  # applies_to: which decision types the deliverable makes sense for.
  # "all" = technology AND non-technology/do-nothing decisions; [technology] = skipped
  # (with a logged reason, not a gap) when the decision is non-tech. Default: all.
  - id: discovery-report
    mandatory: true
    applies_to: all
    template: deliverable-templates/discovery-report.template.md
  - id: executive-report
    mandatory: true
    applies_to: all
    template: deliverable-templates/executive-report.template.md
  - id: solution-blueprint
    mandatory: true
    applies_to: [technology]
    template: deliverable-templates/solution-blueprint.template.md
  - id: implementation-spec
    mandatory: true
    applies_to: [technology]
    template: deliverable-templates/implementation-spec.template.md
  - id: claude-design-brief
    mandatory: true
    applies_to: [technology]
    template: deliverable-templates/claude-design-brief.template.md
  - id: estimate
    mandatory: false
    applies_to: all
    template: deliverable-templates/estimate.template.md

lenses_config:
  business:
    # Discovery signals stay vendor-neutral (see .claude/rules/no-tech-mention-before-options.md);
    # the PP mapping happens in Options via lens-technology.
    extra_signals: [licensing_baseline, integration_licensing_exposure, sponsor_authority_level]
  operations:
    extra_signals: [excel_anchors, sharepoint_lists_anchors, manual_handoffs]
  user:
    extra_signals: [personas_count, mobile_need, offline_need]
  data:
    extra_signals: [structured_vs_document_storage_today, master_data_owners, retention_policy]
  technology:
    # Active only in Options phase
    constraints_to_check:
      - premium_licensing
      - dataflow_capacity
      - ALM_environments
      - dataverse_storage_quota
      - DLP_policy_compatibility
  governance:
    extra_signals: [DLP_policies, environment_strategy, sensitivity_labels, RBAC_complexity]
  financial:
    extra_signals: [licensing_cost_baseline, internal_chargeback_model]

domain_knowledge:
  - domain-knowledge/powerfx-patterns.md
  - domain-knowledge/screen-patterns.md
  - domain-knowledge/security-patterns.md
  - domain-knowledge/delegation-matrix.md
  # Transplanted 2026-05-28 — references repo (with old vocabulary stripped)
  - domain-knowledge/excel-patterns.md
  - domain-knowledge/dataverse-reference.md
  - domain-knowledge/azure-sql-reference.md
  - domain-knowledge/sharepoint-reference.md
  - domain-knowledge/anonymization.md
  - domain-knowledge/flows-patterns.md
  - domain-knowledge/estimation-model.md
  - domain-knowledge/screen-consolidation-rules.md
  # Team delivery conventions (naming, ALM, traceability stamping) — added 2026-08-31
  - domain-knowledge/delivery-conventions.md

question_bank: question-bank.md
glossary: glossary.md

decision_tree:
  source: decision-tree.md
  consulted_in_phase: options  # never in discovery

epistemics:
  # Half-life overrides for this pack's domain. Empty = the kernel defaults apply
  # (library/kernel/states.md -> "Epistemic half-lives").
  # TODO(team): calibrate at the pilot retro (e.g. plataforma-tecnica: 9 meses
  # if platform limits churn faster than the kernel default).
  half_lives_override: {}
